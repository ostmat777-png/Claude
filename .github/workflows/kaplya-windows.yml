# Checks the Kaplya app (kaplya/) on a real Windows machine and builds the
# installer. The parts that talk to Windows cannot be tested anywhere else.
name: Kaplya (Windows)

on:
  push:
    paths:
      - 'kaplya/**'
      - '.github/workflows/kaplya-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kaplya-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: kaplya
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The same file a person double-clicks: it installs everything.
      - name: run.bat prepares the app
        shell: cmd
        run: call run.bat --check

      - name: Unit tests
        run: npm test

      - name: Helper self-test (Windows PowerShell 5.1)
        shell: cmd
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File src\helper\helper.ps1 -SelfTest

      - name: Helper through the app's bridge
        shell: cmd
        run: |
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File tests\make-ocr-sample.ps1 -Path "%RUNNER_TEMP%\ocr-sample.png"
          set "KAPLYA_OCR_SAMPLE=%RUNNER_TEMP%\ocr-sample.png"
          node tests\helper.test.js

      - name: The app itself
        run: |
          npm install --no-save --no-audit --no-fund playwright-core@1.65.0
          node tests/e2e/run.js

      - name: Build the installer
        run: npm run dist

      - name: The built program starts
        run: node tests/e2e/packaged.js

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaplya-test-screens
          path: kaplya/tests/e2e/out
          if-no-files-found: ignore
          retention-days: 14

      - name: Keep the installer
        uses: actions/upload-artifact@v4
        with:
          name: Kaplya-Windows
          path: |
            kaplya/dist/Kaplya-Setup-*.exe
            kaplya/dist/Kaplya-Portable-*.exe
          retention-days: 90
