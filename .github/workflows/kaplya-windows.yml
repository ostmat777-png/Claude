# Checks the Kaplya app (kaplya/) on a real Windows machine and builds the
# installer. The parts that talk to Windows cannot be tested anywhere else.
name: Kaplya (Windows)

on:
  push:
    paths:
      - 'kaplya/**'
      - '.github/workflows/kaplya-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kaplya-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: kaplya
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The same file a person double-clicks: it installs everything.
      - name: run.bat prepares the app
        shell: cmd
        run: call run.bat --check

      # A fresh computer: no Node.js at all, and a folder with spaces and Russian
      # letters in its name. run.bat must bring its own Node.js and still work.
      - name: run.bat on a computer without Node.js
        shell: pwsh
        run: |
          npm install --no-save --no-audit --no-fund playwright-core@1.65.0
          $node = (Get-Command node).Source
          $dir = Join-Path $env:RUNNER_TEMP 'Капля тест'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item -Recurse -Force src, assets, tools, package.json, package-lock.json, run.bat $dir
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -and (-not (Test-Path (Join-Path $_ 'node.exe'))) }) -join ';'
          if (Get-Command node -ErrorAction SilentlyContinue) { throw 'node is still on PATH' }
          & "$dir\run.bat" --check
          if ($LASTEXITCODE -ne 0) {
            if (Test-Path "$dir\install.log") { Get-Content "$dir\install.log" -Tail 40 }
            throw 'run.bat failed'
          }
          if (-not (Test-Path "$dir\.tools\node\node.exe")) { throw 'the private copy of Node.js is missing' }
          if (-not (Test-Path "$dir\node_modules\electron\dist\electron.exe")) { throw 'Electron is missing' }
          # and the app really runs from that folder, helper included
          & $node tests/e2e/packaged.js "$dir\node_modules\electron\dist\electron.exe" "$dir"
          if ($LASTEXITCODE -ne 0) { throw 'the app did not start from that folder' }

      - name: Unit tests
        run: npm test

      - name: Helper self-test (Windows PowerShell 5.1)
        shell: cmd
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File src\helper\helper.ps1 -SelfTest

      - name: Helper through the app's bridge
        shell: cmd
        run: |
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File tests\make-ocr-sample.ps1 -Path "%RUNNER_TEMP%\ocr-sample.png"
          set "KAPLYA_OCR_SAMPLE=%RUNNER_TEMP%\ocr-sample.png"
          node tests\helper.test.js

      - name: The app itself
        run: node tests/e2e/run.js

      - name: Build the installer
        run: npm run dist

      - name: The built program starts
        run: node tests/e2e/packaged.js

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaplya-test-screens
          path: kaplya/tests/e2e/out
          if-no-files-found: ignore
          retention-days: 14

      # Just the kaplya folder, for those who start it with run.bat: the repository's
      # own "Download ZIP" would bring everything else in it too.
      - name: Only the kaplya folder
        shell: bash
        working-directory: .
        run: |
          mkdir -p "$RUNNER_TEMP/kaplya-folder"
          git archive --format=tar HEAD kaplya | tar -x -C "$RUNNER_TEMP/kaplya-folder"

      - name: Keep the kaplya folder
        uses: actions/upload-artifact@v4
        with:
          name: Kaplya-folder
          path: ${{ runner.temp }}/kaplya-folder
          retention-days: 90

      - name: Keep the installer
        uses: actions/upload-artifact@v4
        with:
          name: Kaplya-Windows
          path: |
            kaplya/dist/Kaplya-Setup-*.exe
            kaplya/dist/Kaplya-Portable-*.exe
          retention-days: 90
